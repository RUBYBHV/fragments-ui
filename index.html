<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fragments UI</title>
    <link rel="stylesheet" href="src/index.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <h1>Fragments UI</h1>
    <section>
      <nav>
        <button id="login">Login</button>
        <button id="logout" hidden>Logout</button>
      </nav>
    </section>
    <section hidden id="user">
      <h2>Welcome <span class="username"></span>!</h2>
        <select id="fragment-type">
          <option value="text/plain">Text (text/plain)</option>
          <option value="text/markdown">Markdown (text/markdown)</option>
          <option value="text/html">HTML (text/html)</option>
          <option value="application/json">JSON (application/json)</option>
        </select>
        <br/><br/>
        <textarea id="fragment-data" rows="4" cols="50" placeholder="Enter fragment text..."></textarea><br/>
        <button id="post-fragment">POST Fragment</button>
      </div>
      <button id="get-fragments">Get Fragments</button>
      <div id="fragments-container"></div>
    </section>
  </body>
</html>
